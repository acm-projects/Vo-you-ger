<!DOCTYPE html>
<html>
<head>
    <title>Your Assessments</title>
    <link rel="stylesheet" href="assessments.css">
    <script type="module" src="assessments.jsx"></script>
</head>
<body>
    <div class="app">
        <h1>Your Assessment</h1>

        <!-- PROGRESS BAR -->
        <div class="progress-section">
            <div class="progress-label">
                <span id="progress-text">0 of 18 questions answered</span>
                <span id="progress-percent">0%</span>
            </div>

            <div class="progress-track"
                role="progressbar"
                aria-label="Assessment progress"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0">

                <!-- Dotted flight path -->
                <div id="progress-fill"></div>

                <!-- Milestone markers -->
                <span class="route-marker marker-25"></span>
                <span class="route-marker marker-50"></span>
                <span class="route-marker marker-75"></span>
                <span class="route-marker marker-100"></span>

                <span id="progress-plane" aria-hidden="true">✈</span>

            </div>
        </div>


        <div class="quiz">
            <h2 id="question">Question goes here</h2>
            <div id="answer-buttons"></div>

            <div class="quiz-nav">
                <button id="back-btn">Back</button>
                <button id="next-btn">Next</button>
            </div>
        </div>
    </div>
</body>
</html>
