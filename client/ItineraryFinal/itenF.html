<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Penang Travel Journal</title>
  <link rel="stylesheet" href="./itenF.css">
  <script src="./itenF.js" defer></script>
</head>

<body>
  <main class="app">

    <!-- JOURNAL COVER -->
    <button id="journalCover" class="journal-cover" type="button">
      <span class="cover-top">YOUR NEW ADVENTURE BOOK</span>

      <span class="cover-title">
        <span class="cover-small">THE TRAVEL JOURNAL</span>
        <span class="cover-destination">Penang</span>
        <span class="cover-country">MALAYSIA</span>
      </span>

      <span class="cover-decoration">✦ ✧ ✦</span>

      <span class="cover-details">
        24 — 28 OCTOBER 2026
      </span>

      <span class="cover-prompt">
        <span class="prompt-sparkle">✧</span>
        <span>Open my journal</span>
        <span class="prompt-arrow">→</span>
      </span>
    </button>


    <!-- OPEN JOURNAL -->
    <section id="journalOpen" class="journal-open hidden">

      <div class="book-shell">

        <!-- BOOK SPINE -->
        <div class="book-spine"></div>


        <!-- BOOK SPREAD -->
        <div class="book-spread">

          <!-- LEFT PAGE -->
          <section class="book-page left-page">
            <div id="leftPageContent" class="page-content"></div>

            <span id="leftPageNumber" class="printed-page-number">
              01
            </span>
          </section>


          <!-- RIGHT PAGE -->
          <section class="book-page right-page">
            <div id="rightPageContent" class="page-content"></div>

            <span id="rightPageNumber" class="printed-page-number">
              02
            </span>
          </section>


          <!-- FLIPPING SHEET -->
          <div id="turningSheet" class="turning-sheet hidden">

            <!-- FRONT OF TURNING PAGE -->
            <div id="turningFront"
              class="turning-face turning-front">
            </div>

            <!-- BACK OF TURNING PAGE -->
            <div id="turningBack"
              class="turning-face turning-back">
            </div>

          </div>

        </div>


        <!-- DAY TABS -->
        <nav id="dayTabs"
          class="day-tabs"
          aria-label="Itinerary days">
        </nav>


        <!-- PAGE NAVIGATION -->
        <button
          id="previousDay"
          class="book-arrow book-prev"
          type="button"
          aria-label="Previous day">

          <span aria-hidden="true">‹</span>
        </button>

        <button
          id="nextDay"
          class="book-arrow book-next"
          type="button"
          aria-label="Next day">

          <span aria-hidden="true">›</span>
        </button>

      </div>


      <!-- BOOK FOOTER -->
      <div class="book-bottom">
        <span id="spreadDayLabel">DAY 1</span>
        <span id="spreadDateLabel"></span>
      </div>

    </section>

  </main>


  <!-- DESTINATION DETAILS POPUP -->
  <div
    id="detailsModal"
    class="modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="detailsTitle">

    <div
      class="modal-backdrop"
      data-close-modal>
    </div>


    <article class="postcard-modal">

      <!-- CLOSE BUTTON -->
      <button
        id="closeDetails"
        class="modal-close"
        type="button"
        aria-label="Close">
        ×
      </button>


      <!-- POPUP CONTENT -->
      <div class="postcard-content">

        <span class="postcard-label">
          ✦ A LITTLE TRAVEL MEMORY ✦
        </span>

        <h2 id="detailsTitle"></h2>

        <p id="detailsDescription"></p>

        <div id="detailsMeta" class="details-meta"></div>

        <button
          id="detailsDone"
          class="done-button"
          type="button">
          Back to the journal ✿
        </button>

      </div>

    </article>

  </div>

</body>
</html>
